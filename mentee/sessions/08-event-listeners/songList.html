<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Song List</title>
    <link rel="stylesheet" href="songList.css" />
  </head>
  <body>
    <h1>My Song List</h1>

    <form id="song-form">
      <label for="song-title">Song Title</label>
      <input
        type="text"
        id="song-title"
        placeholder="Enter song title"
        required
      />

      <label for="song-plays">Number of Plays</label>
      <input
        type="number"
        id="song-plays"
        placeholder="Enter number of plays"
        min="0"
        required
      />

      <button type="submit">Add Song</button>
    </form>

    <p id="summary"></p>

    <ul id="song-list"></ul>

    <script src="make.js" defer></script>
  </body>
</html>
